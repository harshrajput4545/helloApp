trigger:
  name: HelloApp GitHub Push
  identifier: HelloApp_GitHub_Push
  enabled: true
  description: "Run CI/CD when code is pushed to main"
  tags: {}
  orgIdentifier: default
  projectIdentifier: default
  pipelineIdentifier: HelloApp_CI_CD
  source:
    type: Webhook
    spec:
      type: Github
      spec:
        type: Push
        spec:
          connectorRef: connector_Github_03e3
          autoAbortPreviousExecutions: false
          payloadConditions:
            - key: targetBranch
              operator: Equals
              value: main
          repoName: hello-world   # yahan bhi same repo name
  pipelineBranchName: main
  inputYaml: |
    pipeline:
      identifier: HelloApp_CI_CD
      properties:
        ci:
          codebase:
            build:
              type: branch
              spec:
                branch: <+trigger.branch>