
pipeline:
  name: HelloApp CI CD
  identifier: HelloApp_CI_CD
  projectIdentifier: default
  orgIdentifier: default

  properties:
    ci:
      codebase:
        connectorRef: connector_Github_03e3
        repoName: helloApp
        build:
          type: branch
          spec:
            branch: main

  stages:
    - stage:
        name: Build Push and Deploy
        identifier: Build_Push_Deploy
        type: CI
        spec:
          cloneCodebase: true

          infrastructure:
            type: Cloud
            spec:
              os: Linux

          execution:
            steps:
              - step:
                  type: Run
                  name: Docker Login
                  identifier: Docker_Login
                  spec:
                    shell: Bash
                    command: |
                      echo "$DOCKERHUB_TOKEN" | docker login \
                        -u "$DOCKERHUB_USERNAME" --password-stdin
                  envVariables:
                    DOCKERHUB_USERNAME: <+secrets.getValue("dockerhub_username")>
                    DOCKERHUB_TOKEN: <+secrets.getValue("dockerhub_token")>

              - step:
                  type: Run
                  name: Build and Push Docker Image
                  identifier: Build_Push_Image
                  spec:
                    shell: Bash
                    command: |
                      IMAGE="harshrajput29/hello-world-spring"

                      docker build -t "$IMAGE:<+pipeline.sequenceId>" .
                      docker push "$IMAGE:<+pipeline.sequenceId>"

                      docker tag "$IMAGE:<+pipeline.sequenceId>" "$IMAGE:latest"
                      docker push "$IMAGE:latest"

              - step:
                  type: Run
                  name: Deploy on EC2
                  identifier: Deploy_EC2
                  spec:
                    shell: Bash
                    command: |
                      set -e

                      mkdir -p ~/.ssh
                      chmod 700 ~/.ssh

                      printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/ec2.pem
                      chmod 600 ~/.ssh/ec2.pem

                      ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

                      ssh -i ~/.ssh/ec2.pem \
                        -o StrictHostKeyChecking=yes \
                        "$EC2_USER@$EC2_HOST" << 'REMOTE'

                      set -e

                      docker pull harshrajput29/hello-world-spring:latest

                      docker stop hello-container || true
                      docker rm hello-container || true

                      docker run -d \
                        --restart unless-stopped \
                        --name hello-container \
                        -p 8081:8081 \
                        harshrajput29/hello-world-spring:latest

                      docker image prune -f

                      REMOTE

                      rm -f ~/.ssh/ec2.pem

                      echo "Deployment completed!"

                  envVariables:
                    EC2_HOST: "13.232.120.185"
                    EC2_USER: ubuntu
                    EC2_SSH_KEY: <+secrets.getValue("ec2_ssh_key")>
